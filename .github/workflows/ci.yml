name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Windows runner 的管道默认编码是 cp1252，脚本输出 ✓ 等字符会直接 UnicodeEncodeError。
# 全局强制 UTF-8：ubuntu 上无感，windows 上是生死线。
env:
  PYTHONUTF8: "1"
  # 渲染类测试缺浏览器 / ffmpeg / numpy 时本地会 SKIP；CI 上不许跳过 —— 跳过也是绿的，等于没测。
  HX_NO_SKIP: "1"

# GITHUB_TOKEN 只给读权限：CI 只读代码、跑检查，不写仓库（未声明时拿的是仓库默认权限）。
permissions:
  contents: read

# 每个分支只关心最新一次运行；被取代的自动取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows + Git Bash 是主要开发平台，所以和 Linux 一起测，
        # 而不是被当成事后补的。
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]

    # action 钉到 commit SHA：tag 可以被重新指向（供应链攻击），SHA 不行。升级时连同注释里的版本号一起改。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # --- 渲染类回归测试的依赖：node/ 下的 playwright-core（按 lock 装），以及 numpy / pillow / imageio-ffmpeg ---
      # 浏览器用 runner 自带的 Chrome / Edge。runner 的 PATH 上没有 ffmpeg，而测试只认 PATH（shutil.which），
      # 所以把 imageio-ffmpeg 的静态二进制以 ffmpeg 为名放上 PATH —— 与技能「PATH 取不到就回退 imageio-ffmpeg」同一来源。
      - name: Install render dependencies
        shell: bash
        run: |
          set -e
          npm ci --prefix node --no-audit --no-fund
          python -m pip install numpy pillow imageio-ffmpeg
          python -c "import imageio_ffmpeg, os, shutil; d = os.path.join(os.environ['RUNNER_TEMP'], 'ffbin'); os.makedirs(d, exist_ok=True); shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), os.path.join(d, 'ffmpeg.exe' if os.name == 'nt' else 'ffmpeg')); open(os.environ['GITHUB_PATH'], 'a').write(d + '\\n')"

      # --- 仓库自洽性：版本号漂移、风格目录漂移、残留外链 ---
      - name: Repository integrity check
        run: python scripts/check_integrity.py

      # --- Python 脚本至少在支持的最低版本上要能编译 ---
      - name: Compile Python scripts
        run: python -m compileall -q scripts

      # --- 画面体检工具要能被导入，且命令行要能响应 ---
      - name: Lint tool smoke test
        run: python scripts/lint_frames.py --help

      - name: Integrity checker smoke test
        run: python scripts/check_integrity.py --root .

      # --- Shell 入口语法 ---
      - name: Check setup_env.sh syntax
        shell: bash
        run: bash -n setup_env.sh

      # --- 文本规则回归：去句读标点，但词里的点不是标点（左右都是数字或 ASCII 字母：2.4% / ASN.1 / X.509）---
      # 这条不变式有五个出口（屏幕字幕 / SRT / B() 节拍 / 火山切句 / subs.json），
      # 任何一处削掉它，屏幕上就会出现「念 2.4%、写 24%」的假数字或「ASN1」，且不报错（lessons #88、#143）。
      - name: Subtitle text rules regression test
        run: python tests/test_subs_text.py

      # --- 块起点不落在停顿上：阿里把停顿并进下一个英文词的首字母（「：|p」+「andas」），块从这一项的结尾起；
      #     并进 2–3 个字母的（「；|Not」+「ion」）从结尾再往前退 0.125 s（lessons #152）；
      #     拼读的字母、停顿在空档里、插值的等长项不动，同一段别的块一个不变（lessons #144；真实时间戳，不联网）---
      - name: Pause-letter block start regression test
        run: python tests/test_subs_pause_letter.py

      # --- 阿里 TTS：SSE 多行 data 拼接 / 判错 / 时间戳映射回原文（不联网、不需要密钥）---
      - name: Aliyun TTS regression test
        run: python tests/test_tts_ali.py

      # --- 字级时间戳均分：整段每字一样长 / 段尾步长相同时提醒，manifest 记 even_timestamps（lessons #139；不联网）---
      - name: Even timestamp warning regression test
        run: python tests/test_tts_even_timestamps.py

      # --- 切块符 `|` 不送 TTS：三个引擎送的文本里都没有 `|`，subs 的块照旧对到首字的时间戳，
      #     含 `|` 的段换缓存签名（lessons #142；假引擎，不联网）---
      - name: Chunk separator regression test
        run: python tests/test_tts_chunk_marks.py

      # --- 截断的合成不算成功：分块传输断在两块之间时标准库不报错，读流要读到最终帧 / 结束标记；
      #     0 个字级时间戳、音频短得不像这段文字的结果重试后非零退出，不进缓存，坏的缓存读时认出来重配
      #     （lessons #150；真的 http.client 分块响应 + 假引擎，不联网）---
      - name: Truncated synthesis regression test
        run: python tests/test_tts_truncated.py

      - name: Beats matcher regression test
        run: node tests/test_beats_norm.mjs

      # --- 交给浏览器执行的源码字符串：模板字符串会吃掉 \d \- 这类转义（lessons #137）---
      # check_cover 的 pureNumber 正则因此退化，英文钩子被当成纯数字跳过，小卡片顶替成钩子。
      - name: Page probe escape regression test
        run: node tests/test_page_probe_escapes.mjs

      # --- 渲染与 seek 历史无关：--workers 3 与 --workers 1 逐帧一致（lessons #138；缺浏览器/ffmpeg 时跳过）---
      # GSAP 补间在首次渲染时才记录起点，并行页面不补齐跳过的帧就会各定各的起点，成片来回跳，qc ⑥ 抓不到。
      - name: Seek history regression test
        run: node tests/test_seek_history.mjs

      # --- 搭建期读布局：--workers 并行渲染下每 N 帧跳一下，单页检查全绿（lessons #134）；
      #     顺着 <link rel=stylesheet> 扫本地样式表，英文帧不要求中文字体族（lessons #148）；
      #     色值只在颜色上下文里找：脚本字符串「#301–」、id 选择器「#c13」、注释、画面文字不算，真的颜色照报（lessons #151）---
      - name: Frame lint regression test
        run: python tests/test_lint_frames.py

      # --- 逐帧连续性：单帧跳动 / 场间硬切（B 段缺 numpy 或 ffmpeg 时自动跳过）---
      - name: QC continuity regression test
        run: python tests/test_qc_continuity.py

      # --- QC 实测帧数：有的 ffmpeg 构建流复制时不数帧，要解码一遍再数，否则帧数校验被静默跳过（lessons #149）---
      - name: QC frame count regression test
        run: python tests/test_qc_frame_count.py

      # --- 几何体检量出场之前那一刻：轴末已经出场、全淡没了，量到 0 个元素也是「全绿」（lessons #147）---
      - name: Layout check before exit regression test
        run: node tests/test_layout_exit.mjs

      # --- 拼音轨不漂移：每段占满 layout 槽位，beep ±10 ms（lessons #136）；末帧不是缓冲不够 libmp3lame 的半截帧
      #     （lessons #141）。B、C 段缺 numpy 或 ffmpeg 时自动跳过 ---
      - name: Timeline audio sync regression test
        run: python tests/test_timeline_build.py

      # --- frontmatter description 的长度上限 ---
      # 超长时本地一切正常，只有换到按 1024 字符扫描的加载器才会「整个技能消失」，
      # 且不报错。这类缺陷在本地不可观测，只能在构建期钉住。
      - name: Skill frontmatter regression test
        run: python tests/test_skill_frontmatter.py

      # --- 渲染器 / 封面器 / 单帧速览工具的语法 ---
      - name: Check Node module syntax
        shell: bash
        run: |
          set -e
          for f in scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Check templates are self-contained
        shell: bash
        run: |
          set -e
          # 画面帧绝不允许引 CDN 或网络字体：离线渲染不会报错，只会静默劣化。
          # 只扫 HTML —— markdown 文档里*提到*这些 URL 是合理的
          # （比如正是指南在教你要把它们删掉），而 GSAP 自带的 README 也会介绍它的 CDN 用法。
          hits=$(grep -rInE --include='*.html' \
            'https?://[^"'"'"' ]*(fonts\.googleapis|fonts\.gstatic|cdn\.)' . \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::external font or CDN reference found in an HTML template"
            exit 1
          fi
          echo "no external font or CDN references in HTML templates"
